<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mahak - Jewellery & Gold Kitty Savings</title>
  <meta name="description" content="Manage your gold savings plans, view live gold rates, and explore fine jewellery collections.">
  
  <!-- Google Fonts: Playfair Display & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Mobile Device Outer Shell (Centered on desktop, full-width on mobile) -->
  <div class="mobile-viewport">
    
    <!-- iOS / Mobile Status Bar & Emerald Header -->
    <header class="app-header">
      <div class="status-bar" id="statusBar">
        <div class="status-time">9:41</div>
        <div class="status-icons">
          <!-- Cellular Signal -->
          <svg class="status-icon" viewBox="0 0 17 11" fill="currentColor">
            <rect x="0" y="8" width="3" height="3" rx="0.8" />
            <rect x="4.6" y="5.5" width="3" height="5.5" rx="0.8" />
            <rect x="9.3" y="3" width="3" height="8" rx="0.8" />
            <rect x="14" y="0" width="3" height="11" rx="0.8" />
          </svg>
          <!-- Wifi -->
          <svg class="status-icon" viewBox="0 0 16 12" fill="currentColor">
            <path d="M8 9.5a1.5 1.5 0 100 3 1.5 1.5 0 000-3zM4.9 7.4a4.4 4.4 0 016.2 0 .8.8 0 001.1-1.1 5.9 5.9 0 00-8.4 0 .8.8 0 101.1 1.1zm-3-3a8.6 8.6 0 0112.2 0 .8.8 0 101.1-1.1 10.1 10.1 0 00-14.4 0 .8.8 0 101.1 1.1z" />
          </svg>
          <!-- Battery -->
          <svg class="status-icon" viewBox="0 0 25 12" fill="currentColor">
            <rect x="0.5" y="0.5" width="21" height="11" rx="3.5" fill="none" stroke="currentColor" stroke-width="1" />
            <rect x="2" y="2" width="18" height="8" rx="2" fill="currentColor" />
            <path d="M23 4v4c.6-.3 1-1 1-2s-.4-1.7-1-2z" />
          </svg>
        </div>
      </div>

      <!-- Top Greeting Row -->
      <div class="greeting-row">
        <div class="greeting-content">
          <p class="greeting-sub">Good Morning</p>
          <h1 class="greeting-title">Mahak <span class="wave-emoji" style="font-family: 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif;">👋</span></h1>
        </div>
        <button class="notification-btn" id="notificationBtn" aria-label="Notifications" type="button">
          <img src="assets/icons/bell.svg" alt="Notifications" width="22" height="22">
        </button>
      </div>

      <!-- Search Bar -->
      <div class="search-container" id="searchContainer">
        <div class="search-box">
          <img src="assets/icons/search.svg" alt="Search" class="search-icon" width="17" height="17">
          <input type="text" id="searchInput" placeholder="Search jewellery, gold plans or collections" autocomplete="off" spellcheck="false">
        </div>
      </div>

      <!-- Today's Gold Price Card -->
      <section class="gold-rate-card" id="goldRateCard" tabindex="0" role="button" aria-label="Today's Gold Price 22KT 6450 per gram">
        <div class="gold-card-details">
          <span class="gold-card-label">Today's Gold Price (22KT)</span>
          <div class="gold-price-line">
            <span class="gold-currency">₹</span><span class="gold-price-amount">6,450</span>
            <span class="gold-unit"> / gm</span>
          </div>
          <div class="gold-trend-badge">
            <svg class="trend-arrow" viewBox="0 0 10 10" fill="currentColor">
              <polygon points="5,1 9,8 1,8" />
            </svg>
            <span class="trend-text">+120 (3.9%)</span>
          </div>
        </div>
        <div class="gold-card-visual">
          <img src="assets/images/gold-bar.jpg" alt="24KT Gold Bullion Bar with Gold Nuggets" class="gold-bar-img" loading="eager">
        </div>
      </section>
    </header>

    <!-- Main Content Container (Soft Ivory Background) -->
    <main class="app-body">
      
      <!-- Quick Action Icons Row -->
      <nav class="quick-actions" aria-label="Quick Actions">
        <button class="action-item" id="actionGoldPlans" type="button" onclick="window.location.href='goldPlan.html'">
          <div class="action-icon-circle">
            <img src="assets/icons/gold-plans.svg" alt="Gold Plans Icon" width="22" height="22">
          </div>
          <span class="action-label">Gold Plans</span>
        </button>

        <button class="action-item" id="actionPayInstallment" type="button">
          <div class="action-icon-circle">
            <img src="assets/icons/pay-installment.svg" alt="Pay Installment Icon" width="22" height="22">
          </div>
          <span class="action-label">Pay<br>Installment</span>
        </button>

        <button class="action-item" id="actionExploreJewellery" type="button">
          <div class="action-icon-circle">
            <img src="assets/icons/explore-jewellery.svg" alt="Explore Jewellery Icon" width="22" height="22">
          </div>
          <span class="action-label">Explore<br>Jewellery</span>
        </button>

        <button class="action-item" id="actionGoldPrice" type="button">
          <div class="action-icon-circle">
            <img src="assets/icons/gold-price.svg" alt="Gold Price Icon" width="22" height="22">
          </div>
          <span class="action-label">Gold Price</span>
        </button>
      </nav>

      <!-- Active Plan Section -->
      <section class="section-container active-plan-section" aria-labelledby="activePlanHeading">
        <div class="section-header">
          <h2 class="section-title" id="activePlanHeading">Your Active Plan</h2>
          <button class="view-all-btn" id="viewAllPlansBtn" type="button">View All</button>
        </div>

        <div class="plan-card" id="planCard">
          <!-- Top Row: Thumbnail + Title + Circular Progress -->
          <div class="plan-card-top">
            <div class="plan-thumb-wrapper">
              <img src="assets/images/gold-coins.jpg" alt="Gold Savings Plan Coins" class="plan-thumb-img">
            </div>
            
            <div class="plan-info">
              <h3 class="plan-name">11 Month Gold Plan</h3>
              <p class="plan-id">Plan ID: SJG08123</p>
            </div>

            <div class="progress-ring-container" aria-label="Plan completion 45%">
              <svg class="progress-ring" viewBox="0 0 52 52">
                <!-- Background Track -->
                <circle class="progress-ring-bg" cx="26" cy="26" r="22" />
                <!-- Foreground Active Arc -->
                <circle class="progress-ring-fill" cx="26" cy="26" r="22" />
              </svg>
              <div class="progress-text">45%</div>
            </div>
          </div>

          <!-- Middle Row: Paid vs Total Plan -->
          <div class="plan-card-metrics">
            <div class="metric-item">
              <span class="metric-label">Paid</span>
              <span class="metric-value">₹55,000</span>
            </div>
            <div class="metric-item">
              <span class="metric-label">Total Plan</span>
              <span class="metric-value">₹1,20,000</span>
            </div>
          </div>

          <!-- Bottom Row: Next Installment & Pay Now Button -->
          <div class="plan-card-bottom">
            <div class="installment-info">
              <span class="installment-label">Next Installment</span>
              <div class="installment-details">
                <span class="installment-amount">₹5,000</span>
                <span class="installment-due">Due on 5 Oct 2026</span>
              </div>
            </div>
            <button class="pay-now-btn" id="payNowBtn" type="button" onclick="window.location.href='payment.html'">Pay Now</button>
          </div>
        </div>
      </section>

      <!-- Explore Our Collections Section -->
      <section class="section-container collections-section" aria-labelledby="collectionsHeading">
        <div class="section-header">
          <h2 class="section-title" id="collectionsHeading">Explore Our Collections</h2>
          <button class="view-all-btn" id="viewAllCollectionsBtn" type="button">View All</button>
        </div>

        <div class="collections-carousel" id="collectionsCarousel">
          <!-- Rings -->
          <div class="collection-item" id="catRings" role="button" tabindex="0">
            <div class="collection-image-wrapper">
              <img src="assets/images/ring.jpg" alt="Rings Collection" class="collection-img" loading="eager">
            </div>
            <span class="collection-label">Rings</span>
          </div>

          <!-- Earrings -->
          <div class="collection-item" id="catEarrings" role="button" tabindex="0">
            <div class="collection-image-wrapper">
              <img src="assets/images/earrings.jpg" alt="Earrings Collection" class="collection-img" loading="eager">
            </div>
            <span class="collection-label">Earrings</span>
          </div>

          <!-- Chains -->
          <div class="collection-item" id="catChains" role="button" tabindex="0">
            <div class="collection-image-wrapper">
              <img src="assets/images/chain.jpg" alt="Chains Collection" class="collection-img" loading="eager">
            </div>
            <span class="collection-label">Chains</span>
          </div>

          <!-- Necklaces -->
          <div class="collection-item" id="catNecklaces" role="button" tabindex="0">
            <div class="collection-image-wrapper">
              <img src="assets/images/necklace.jpg" alt="Necklaces Collection" class="collection-img" loading="eager">
            </div>
            <span class="collection-label">Necklaces</span>
          </div>
        </div>
      </section>

    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav" id="bottomNav" aria-label="Main Navigation">
      <div class="nav-items-wrapper">
        <button class="nav-item active" id="navHome" type="button" aria-selected="true">
          <div class="nav-icon-container">
            <img src="assets/icons/home-active.svg" alt="Home" width="22" height="22">
          </div>
          <span class="nav-label">Home</span>
        </button>

        <button class="nav-item" id="navPlans" type="button" aria-selected="false">
          <div class="nav-icon-container">
            <img src="assets/icons/plans-nav.svg" alt="Plans" width="22" height="22">
          </div>
          <span class="nav-label">Plans</span>
        </button>

        <button class="nav-item" id="navJewellery" type="button" aria-selected="false">
          <div class="nav-icon-container">
            <img src="assets/icons/jewellery-nav.svg" alt="Jewellery" width="22" height="22">
          </div>
          <span class="nav-label">Jewellery</span>
        </button>

        <button class="nav-item" id="navMyPlan" type="button" aria-selected="false" onclick="window.location.href='scheme.html'">
          <div class="nav-icon-container">
            <img src="assets/icons/my-plan-nav.svg" alt="My Plan" width="22" height="22">
          </div>
          <span class="nav-label">My Plan</span>
        </button>

        <button class="nav-item" id="navProfile" type="button" aria-selected="false">
          <div class="nav-icon-container">
            <img src="assets/icons/profile-nav.svg" alt="Profile" width="22" height="22">
          </div>
          <span class="nav-label">Profile</span>
        </button>
      </div>

      <!-- iOS Home Bar Indicator -->
      <div class="home-indicator"></div>
    </nav>

    <!-- Toast Notification for Interactions -->
    <div class="app-toast" id="appToast" role="status" aria-live="polite"></div>

  </div>

  <script src="js/script.js"></script>
</body>
</html>
